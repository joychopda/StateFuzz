[project]
name = "mcp-stateful-fuzzer"
version = "0.1.0"
description = "Stateful, multi-turn fuzzer for Model Context Protocol (MCP) servers"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mcp-fuzz = "fuzzer.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["fuzzer*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
